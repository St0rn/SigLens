name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run unit and integration tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q --ignore=tests/windows
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean SigLens.spec
      - name: Smoke test standalone executable (Linux)
        if: runner.os == 'Linux'
        run: ./dist/SigLens --help
      - name: Smoke test standalone executable (Windows)
        if: runner.os == 'Windows'
        run: |
          .\dist\SigLens.exe --help
          .\dist\SigLens.exe gui --help

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate AMSI and available Defender integration
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/windows
