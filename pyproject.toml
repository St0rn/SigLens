[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siglens"
version = "2.0.0"
description = "Windows artifact analysis and multi-engine security scanner"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "St0rn / CybersecurIT"}]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pefile>=2024.8.26",
  "yara-python>=4.5",
  "capstone>=5.0",
  "jinja2>=3.1",
  "jsonschema>=4.23",
]

[project.scripts]
siglens = "siglens.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siglens = ["templates/*.html"]

[tool.setuptools.data-files]
"share/siglens/schemas" = [
  "schemas/siglens-report-v1.schema.json",
  "schemas/siglens-source-map-v1.schema.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
